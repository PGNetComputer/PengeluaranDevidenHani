<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengeluaran</title>
<meta name="theme-color" content="#0d6b6b">
<meta name="description" content="Catat & pantau pengeluaran harian.">
<!--PWA-->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pengeluaran">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<!--/PWA-->
<style>
  :root {
    --teal:#0d6b6b; --teal-soft:#e6f2f2; --teal-deep:#094e4e; --ink:#1f2933; --muted:#6b7683;
    --line:#eef1f3; --card:#f7f9fa; --danger:#c0392b; --ok:#1a7f52;
    --amber-bg:#fdf6e3; --amber-line:#e8c05a; --amber-ink:#8a6100;
  }
  * { box-sizing:border-box; font-family:'Google Sans','Segoe UI',Roboto,Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#fff; color:var(--ink); }
  body { -webkit-font-smoothing:antialiased; }
  .wrap { max-width:560px; margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(86px + env(safe-area-inset-bottom,0px)); }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .head .dot { width:36px; height:36px; border-radius:10px; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex:none; }
  .head h2 { margin:0; font-size:19px; letter-spacing:-0.2px; }
  .head .sub { font-size:12px; color:var(--muted); margin-top:1px; }
  .head .st { margin-left:auto; font-size:11px; color:var(--muted); text-align:right; line-height:1.35; }
  .head .st b { color:var(--amber-ink); font-weight:600; }

  label { display:block; font-size:12px; font-weight:600; margin:13px 0 5px; letter-spacing:.2px; }
  label .opt { font-weight:400; color:var(--muted); }
  input, select { width:100%; padding:11px 12px; border:1px solid #dde3e7; border-radius:10px;
    font-size:15px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(13,107,107,.12); }
  .dua { display:grid; grid-template-columns:1.4fr 1fr; gap:8px; }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .seg button { padding:10px 4px; border:1px solid #dde3e7; background:#fff; border-radius:10px;
    font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--teal); border-color:var(--teal); color:#fff; }
  .jumlah-row { display:flex; gap:8px; }
  .jumlah-row input { flex:1; font-size:17px; font-weight:600; }
  .pm { flex:none; width:56px; border:1px solid #dde3e7; border-radius:10px; background:var(--card);
    font-size:20px; font-weight:700; color:var(--muted); cursor:pointer; }
  .pm.aktif { background:var(--danger); border-color:var(--danger); color:#fff; }
  .hint { font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.45; }
  .cek { display:flex; align-items:center; gap:9px; margin-top:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:13.5px; cursor:pointer; }
  .cek input { width:18px; height:18px; margin:0; accent-color:var(--teal); flex:none; }
  .btn { width:100%; margin-top:16px; padding:14px; background:var(--teal); color:#fff; border:none;
    border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { background:#9aa5ac; }
  .btn2 { padding:9px 13px; border:1px solid #cfe3e3; background:var(--teal-soft); color:var(--teal-deep);
    border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .salah { color:var(--danger); font-size:13px; margin-top:8px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { padding:7px 11px; border-radius:18px; border:1px solid #d6e6e6; background:#fff; color:var(--teal-deep);
    font-size:12.5px; cursor:pointer; line-height:1.2; }
  .chip small { color:var(--muted); font-size:11px; }
  .chip.on { background:var(--teal-soft); border-color:var(--teal); }
  .judul-kecil { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.7px; margin:16px 0 8px; }
  .paket-row { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .paket-row button { padding:10px 6px; border:1px dashed #b9d6d6; background:#fbfdfd; border-radius:10px;
    font-size:12.5px; font-weight:600; color:var(--teal-deep); cursor:pointer; line-height:1.25; }
  .paket-row button small { display:block; font-weight:400; color:var(--muted); font-size:10.5px; margin-top:2px; }
  .paket-row button.perlu { border-style:solid; border-color:var(--amber-line); background:var(--amber-bg); }

  .ingat { background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:12px;
    padding:11px 13px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .ingat .tx { flex:1; font-size:12.5px; color:#7a6a3a; line-height:1.4; }
  .ingat .tx b { color:var(--amber-ink); display:block; font-size:13.5px; }
  .ingat.akhir { background:#fdecea; border-color:#e8a29a; }
  .ingat.akhir .tx b { color:#8a1f12; }

  .riwayat { margin-top:22px; }
  .rw { display:flex; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .rw .a { min-width:0; }
  .rw .a div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rw .a small { color:var(--muted); font-size:11px; }
  .rw .n { font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rw .n.min { color:var(--ok); }
  .tunggu { font-size:10px; color:var(--amber-ink); background:var(--amber-bg); border-radius:6px; padding:1px 6px; margin-left:4px; }

  /* ringkasan */
  .periode { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
  .periode button { padding:9px 4px; border:1px solid #dde3e7; background:#fff; border-radius:10px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .periode button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .hero { background:linear-gradient(135deg,var(--teal) 0%,var(--teal-deep) 100%); border-radius:14px;
    padding:17px 18px 15px; color:#fff; margin-bottom:10px; box-shadow:0 6px 18px rgba(13,107,107,.22); }
  .hero .lbl { font-size:12px; opacity:.85; }
  .hero .val { font-size:28px; font-weight:700; margin-top:3px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .hero .bdg { font-size:11.5px; opacity:.85; margin-top:4px; }
  .mini-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
  .mini { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
  .mini .lbl { font-size:11px; color:var(--muted); }
  .mini .val { font-size:16px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
  .mini .ket { font-size:10.5px; color:var(--muted); margin-top:2px; }
  .seksi-item { margin-bottom:11px; }
  .seksi-top { display:flex; justify-content:space-between; font-size:13.5px; font-weight:600; margin-bottom:5px; }
  .bar { height:6px; border-radius:6px; background:var(--line); overflow:hidden; }
  .bar > span { display:block; height:100%; border-radius:6px; }
  details.kat { border-bottom:1px solid var(--line); }
  details.kat summary { list-style:none; padding:9px 2px; cursor:pointer; }
  details.kat summary::-webkit-details-marker { display:none; }
  .kat-top { display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .kat-top small { color:var(--muted); font-size:11px; }
  .kat-top .v { font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .kat-bar { height:4px; border-radius:4px; background:var(--line); margin-top:6px; overflow:hidden; }
  .kat-bar > span { display:block; height:100%; background:var(--teal); opacity:.55; }
  .rinci { padding:0 2px 9px 12px; }
  .rinci div { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:3px 0; }
  .kosong { color:var(--muted); font-size:13px; text-align:center; padding:18px; }
  .set { margin-top:26px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .set .btn2 { text-align:left; }
  .kecil { font-size:11.5px; color:var(--muted); line-height:1.5; }

  /* navigasi bawah */
  .nav { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
  .nav div { max-width:560px; width:100%; display:grid; grid-template-columns:1fr 1fr; }
  .nav button { background:none; border:none; padding:12px 0 13px; font-size:13px; font-weight:600;
    color:var(--muted); cursor:pointer; }
  .nav button.on { color:var(--teal); box-shadow:inset 0 3px 0 var(--teal); }

  /* modal paket */
  .lapis { position:fixed; inset:0; background:rgba(15,25,30,.45); z-index:40; display:none;
    align-items:flex-end; justify-content:center; }
  .lapis.buka { display:flex; }
  .modal { background:#fff; width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); }
  .modal h3 { margin:0 0 3px; font-size:17px; }
  .pk { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .pk input[type=checkbox] { width:20px; height:20px; flex:none; accent-color:var(--teal); margin:0; }
  .pk .nm { flex:1; min-width:0; font-size:13.5px; line-height:1.3; }
  .pk .nm small { display:block; color:var(--muted); font-size:11px; }
  .pk .nm small.ok { color:var(--ok); }
  .pk input.jm { width:118px; flex:none; padding:8px 9px; font-size:14px; text-align:right; }
  .baris-btn { display:flex; gap:8px; margin-top:14px; }
  .baris-btn .btn { margin:0; }
  .batal { flex:none; width:auto; padding:14px 18px; background:#fff; color:var(--muted); border:1px solid #dde3e7; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px));
    background:#1f2933; color:#fff; padding:11px 14px; border-radius:12px; font-size:13.5px; z-index:50;
    display:none; align-items:center; gap:14px; max-width:92vw; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .toast.buka { display:flex; }
  .toast a { color:#8fe0cf; font-weight:700; cursor:pointer; white-space:nowrap; }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid #ddd; border-top-color:var(--teal);
    border-radius:50%; animation:sp .7s linear infinite; vertical-align:-1px; margin-right:5px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="dot">Rp</div>
    <div>
      <h2 id="judul">Catat Pengeluaran</h2>
      <div class="sub">Catat &amp; pantau keuangan harian</div>
    </div>
    <div class="st" id="status"></div>
  </div>

  <!-- gerbang kode akses -->
  <section id="gerbang" hidden>
    <label for="kode">Kode akses</label>
    <input id="kode" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"
           style="font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase">
    <div class="hint">Cukup sekali di HP ini. Kodenya ada di Log eksekusi Apps Script (buatKodeAkses).</div>
    <button class="btn" id="btnKode">Masuk</button>
    <div class="salah" id="kodeSalah" hidden></div>
  </section>

  <!-- tab catat -->
  <section id="tabCatat" hidden>
    <div id="banner"></div>

    <div class="judul-kecil" style="margin-top:4px">Paket</div>
    <div class="paket-row" id="paketRow"></div>

    <div class="judul-kecil">Sering dipakai</div>
    <div class="chips" id="cepat" style="margin-top:0"></div>

    <div class="dua">
      <div><label for="tanggal">Tanggal</label><input type="date" id="tanggal"></div>
      <div><label for="jam">Jam</label><input type="time" id="jam"></div>
    </div>

    <label>Seksi</label>
    <div class="seg" id="seksi"></div>

    <label for="kategori">Kategori</label>
    <select id="kategori"></select>

    <label for="ket" id="ketLabel">Keterangan <span class="opt">(opsional)</span></label>
    <input id="ket" list="ketList" autocomplete="off" placeholder="pilih di bawah atau ketik">
    <datalist id="ketList"></datalist>
    <div class="chips" id="itemChips"></div>

    <label for="jumlah">Jumlah</label>
    <div class="jumlah-row">
      <input id="jumlah" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
      <button type="button" class="pm" id="pm" title="Plus / minus">±</button>
    </div>
    <div class="hint" id="hint"></div>

    <label class="cek" id="cekCash" hidden><input type="checkbox" id="pakaiCash"> Dibayar pakai cash</label>

    <button class="btn" id="simpan">Simpan</button>
    <div class="salah" id="pesan" hidden></div>

    <div class="riwayat">
      <div class="judul-kecil">Catatan terakhir</div>
      <div id="riwayat"></div>
    </div>
  </section>

  <!-- tab ringkasan -->
  <section id="tabRingkas" hidden>
    <div class="periode" id="periode">
      <button data-p="ini" class="on">Bulan ini</button>
      <button data-p="lalu">Bulan lalu</button>
      <button data-p="semua">Semua</button>
    </div>
    <div id="ringkas"></div>

    <div class="set">
      <div class="judul-kecil" style="margin:0">Pengaturan</div>
      <button class="btn2" id="btnNotif" hidden>🔔 Aktifkan notifikasi pengingat</button>
      <div class="kecil" id="notifInfo" hidden></div>
      <button class="btn2" id="btnMuat">↻ Muat ulang data dari Sheets</button>
      <button class="btn2" id="btnKeluar">Keluar dari HP ini</button>
      <div class="kecil" id="infoData"></div>
    </div>
  </section>
</div>

<nav class="nav" id="nav" hidden><div>
  <button data-tab="catat" class="on">✎ Catat</button>
  <button data-tab="ringkas">▤ Ringkasan</button>
</div></nav>

<div class="lapis" id="lapis"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span id="toastTx"></span><a id="toastAksi" hidden>Batalkan</a></div>

<script>
/* ==================================================================
   PENGATURAN
   ================================================================== */
var CFG = window.APP_CFG || {};
var APPS_SCRIPT = CFG.APPS_SCRIPT || '';

var K_KODE = 'PENG_KODE_v1', K_DATA = 'PENG_DATA_v1', K_ANTRE = 'PENG_ANTREAN_v1';
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var WARNA = { 'Pribadi':'#3a86a8', 'Keluarga':'#0d6b6b', 'Sedekah':'#c98a1e' };
var SEKSI = ['Pribadi', 'Keluarga', 'Sedekah'];

var KODE = '';
var DATA = { r: [], kategori: {}, paket: [], bm3: { kategori:'BM3', harian:50000, jumat:150000 }, v: 0 };
var ANTRE = [];          // [{id, rows:[{id,t,j,s,k,ket,n}], kirim:false}]
var MINUS = false, SEKSI_AKTIF = 'Pribadi', PERIODE = 'ini';

/* ==================================================================
   UTILITAS
   ================================================================== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rp(n) { var neg = n < 0, s = String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '-' : '') + 'Rp ' + s; }
function pad(n) { return ('0' + n).slice(-2); }
function hariIni() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function jamIni() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function bulanDari(t) { return t.slice(0, 7); }
function bulanGeser(ym, g) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + g; var d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function namaBulan(ym) { return BULAN[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
function tglIndo(t) { var p = t.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return HARI[d.getDay()] + ', ' + (+p[2]) + ' ' + BULAN[d.getMonth()].slice(0, 3); }
function hariKe(t) { var p = t.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
function sama(a, b) { return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase(); }
function dasar(ket) { return String(ket || '').split(' · ')[0].trim(); }
function buatId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function simpanLokal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ambilLokal(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function hapusLokal(k) { try { localStorage.removeItem(k); } catch (e) {} }

function angkaDari(teks) {
  var neg = String(teks).trim().charAt(0) === '-';
  var d = String(teks).replace(/[^0-9]/g, '');
  if (!d) return 0;
  return (neg ? -1 : 1) * parseInt(d, 10);
}
function formatInput(el, neg) {
  var d = el.value.replace(/[^0-9]/g, '');
  if (!d) { el.value = neg ? '-' : ''; return; }
  el.value = (neg ? '-' : '') + 'Rp ' + parseInt(d, 10).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/* ==================================================================
   JALUR KE APPS SCRIPT (JSONP)
   ================================================================== */
function panggil(param, selesai, batasMs) {
  if (!APPS_SCRIPT) { selesai(new Error('Alamat Apps Script belum diisi di config.js.')); return; }
  var nama = 'pgCb' + Date.now() + Math.floor(Math.random() * 1e4);
  var tag = document.createElement('script'), sudah = false;
  function bersih() { sudah = true; clearTimeout(jam); window[nama] = function () {}; setTimeout(function () { try { delete window[nama]; } catch (e) {} }, 120000); if (tag.parentNode) tag.parentNode.removeChild(tag); }
  var jam = setTimeout(function () { if (sudah) return; bersih(); selesai(new Error('Server tidak menjawab.')); }, batasMs || 45000);
  window[nama] = function (isi) {
    if (sudah) return; bersih();
    if (isi && isi.galat) { var er = new Error(isi.galat); er.kodeSalah = !!isi.kodeSalah; selesai(er); }
    else selesai(null, isi);
  };
  tag.onerror = function () { if (sudah) return; bersih(); selesai(new Error('Tidak bisa menghubungi server.')); };
  tag.src = APPS_SCRIPT + '?' + param + '&k=' + encodeURIComponent(KODE) + '&callback=' + nama + '&_=' + Date.now();
  document.head.appendChild(tag);
}

/* ==================================================================
   DATA: server + antrean
   ================================================================== */
function idServer() { var s = {}; DATA.r.forEach(function (r) { if (r[6]) s[r[6]] = true; }); return s; }

/** Semua baris: dari server + yang masih di antrean (belum terkirim). Tiap baris: [t,jam,s,k,ket,n,id,tunggu] */
function semua() {
  var ada = idServer(), out = DATA.r.slice();
  ANTRE.forEach(function (b) {
    b.rows.forEach(function (x) { if (!ada[x.id]) out.push([x.t, x.j, x.s, x.k, x.ket, x.n, x.id, true]); });
  });
  return out;
}

function muatData(diam) {
  if (!diam) setStatus('<span class="spin"></span>memuat');
  panggil('data=1', function (err, d) {
    if (err) {
      if (err.kodeSalah) { mintaKode('Kode akses sudah diganti. Masukkan kode yang baru.'); return; }
      setStatus(DATA.v ? '' : 'gagal memuat'); if (!DATA.v) toast(err.message);
      return;
    }
    DATA = d;
    simpanLokal(K_DATA, DATA);
    // antrean yang ternyata sudah masuk server (jawaban sebelumnya hilang) dibuang
    var ada = idServer();
    ANTRE = ANTRE.filter(function (b) { return b.kirim === 'sedang' || b.rows.some(function (x) { return !ada[x.id]; }); });
    simpanLokal(K_ANTRE, ANTRE);
    setStatus('');
    renderSemua();
    bukaDariTautan();
  });
}

/* ---------- antrean simpan ---------- */
var MENGIRIM = false, jamKirim = null;

function jadwalKirim(ms) { clearTimeout(jamKirim); jamKirim = setTimeout(kirimAntrean, ms == null ? 2500 : ms); }

function kirimAntrean() {
  if (MENGIRIM || !ANTRE.length || !KODE) { setStatus(''); return; }
  var b = ANTRE[0];
  MENGIRIM = true; b.kirim = 'sedang';
  setStatus('<span class="spin"></span>mengirim');
  var ringkas = b.rows.map(function (x) { return { id:x.id, t:x.t, j:x.j, s:x.s, k:x.k, ket:x.ket, n:x.n }; });
  panggil('simpan=' + encodeURIComponent(JSON.stringify(ringkas)), function (err) {
    MENGIRIM = false; b.kirim = false;
    if (err) {
      simpanLokal(K_ANTRE, ANTRE);
      if (err.kodeSalah) { mintaKode('Kode akses sudah diganti. Catatan yang belum terkirim tetap disimpan di HP ini.'); return; }
      setStatus('');
      jadwalKirim(15000);                 // coba lagi nanti
      return;
    }
    ANTRE.shift();
    b.rows.forEach(function (x) { DATA.r.push([x.t, x.j, x.s, x.k, x.ket, x.n, x.id]); });
    simpanLokal(K_ANTRE, ANTRE); simpanLokal(K_DATA, DATA);
    if (ANTRE.length) kirimAntrean(); else { setStatus(''); renderRiwayat(); }
  }, 40000);
}

function setStatus(h) {
  var n = 0; ANTRE.forEach(function (b) { n += b.rows.length; });
  $('status').innerHTML = (h || '') + (n ? (h ? '<br>' : '') + '<b>' + n + ' belum terkirim</b>' : '');
}

/** Tambah baris ke antrean -> tampil seketika, dikirim di latar. */
function catat(rows, pesan) {
  var b = { id: buatId(), rows: rows, kirim: false };
  ANTRE.push(b);
  simpanLokal(K_ANTRE, ANTRE);
  setStatus('');
  renderSemua();
  toast('✓ ' + pesan, function () {
    if (b.kirim) return false;
    ANTRE = ANTRE.filter(function (x) { return x !== b; });
    simpanLokal(K_ANTRE, ANTRE); setStatus(''); renderSemua(); toast('Dibatalkan');
    return true;
  });
  jadwalKirim(3000);
}

/* ==================================================================
   ANALISIS POLA
   ================================================================== */
var WINDOW_HARI = 56, MIN_HARI = 6;   // "sering" = muncul di >= 6 hari berbeda dalam 8 minggu

function tglMundur(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/** Item sering: [{s,k,b(dasar),hari,tanda,varian,jumlahTetap}] urut paling sering. */
function itemSering() {
  var batas = tglMundur(WINDOW_HARI), g = {};
  semua().forEach(function (r) {
    if (r[0] < batas || /^Dibayar Cash/i.test(r[4])) return;
    var b = dasar(r[4]), key = r[2] + '|' + r[3] + '|' + b.toLowerCase();
    var x = g[key] || (g[key] = { s:r[2], k:r[3], b:b, hari:{}, plus:0, minus:0, varian:{}, n:[] });
    x.hari[r[0]] = 1; if (r[5] < 0) x.minus++; else x.plus++;
    if (r[4] && r[4] !== b) x.varian[r[4]] = 1;
    x.n.push(r[5]);
  });
  var out = [];
  Object.keys(g).forEach(function (k) {
    var x = g[k], h = Object.keys(x.hari).length;
    if (h < MIN_HARI) return;
    var akhir = x.n.slice(-3);
    out.push({ s:x.s, k:x.k, b:x.b, hari:h, minus: x.minus > x.plus, adaVarian: Object.keys(x.varian).length > 0,
               tetap: akhir.length === 3 && akhir[0] === akhir[1] && akhir[1] === akhir[2] ? Math.abs(akhir[0]) : 0 });
  });
  out.sort(function (a, b) { return b.hari - a.hari; });
  return out;
}

function targetBm3(t) { return hariKe(t) === 5 ? DATA.bm3.jumat : DATA.bm3.harian; }
function totalBm3(t) { var n = 0; semua().forEach(function (r) { if (r[0] === t && sama(r[3], DATA.bm3.kategori)) n += r[5]; }); return n; }

/** Sama persis dengan statusPaket_ di Kode.gs. */
function statusPaket(p, t) {
  var awal = p.periode === 'hari' ? t : t.slice(0, 7), rows = semua(), hasil = [];
  p.item.forEach(function (it) {
    var total = 0, ada = false, akhir = 0;
    rows.forEach(function (r) {
      if (sama(r[2], it.s) && sama(r[3], it.k) && sama(r[4], it.t)) akhir = r[5];
      if (r[0].slice(0, awal.length) !== awal) return;
      if (!sama(r[2], it.s) || !sama(r[3], it.k) || !sama(r[4], it.t)) return;
      ada = true; total += r[5];
    });
    var sudah = it.penuh ? total >= it.j : ada;
    hasil.push({ it: it, sudah: sudah, total: total, sisa: it.penuh ? Math.max(it.j - total, 0) : 0, akhir: akhir });
  });
  return hasil;
}

/** Apakah paket sedang dalam masa pengingat hari ini? 0 tidak, 1 biasa, 2 peringatan terakhir. */
function masaPaket(p, t) {
  if (p.periode === 'hari') return hariKe(t) === p.hari ? 1 : 0;
  var d = +t.slice(8), j = p.jadwal; if (!j) return 0;
  if (d >= j.dari && d <= j.sampai) return 1;
  if (d > j.sampai && d <= j.akhirSampai) return 2;
  return 0;
}

/* ==================================================================
   FORM CATAT
   ================================================================== */
function daftarKategori(s) {
  var dasarList = (DATA.kategori && DATA.kategori[s]) || [], lihat = {}, out = [];
  dasarList.forEach(function (k) { lihat[k.toLowerCase()] = 1; out.push(k); });
  semua().forEach(function (r) { if (r[2] === s && !lihat[r[3].toLowerCase()]) { lihat[r[3].toLowerCase()] = 1; out.push(r[3]); } });
  return out;
}

function renderSeksi() {
  $('seksi').innerHTML = SEKSI.map(function (s) {
    return '<button type="button" data-s="' + s + '" class="' + (s === SEKSI_AKTIF ? 'on' : '') + '">' + s + '</button>';
  }).join('');
}

function isiKategori(pilih) {
  var list = daftarKategori(SEKSI_AKTIF);
  $('kategori').innerHTML = list.map(function (k) { return '<option>' + esc(k) + '</option>'; }).join('');
  if (pilih && list.indexOf(pilih) > -1) $('kategori').value = pilih;
  ubahKategori();
}

function ubahKategori() {
  var s = SEKSI_AKTIF, k = $('kategori').value;
  // datalist: semua keterangan pernah dipakai di kategori ini, paling sering dulu
  var hit = {};
  semua().forEach(function (r) { if (r[2] === s && r[3] === k && r[4]) hit[r[4]] = (hit[r[4]] || 0) + 1; });
  $('ketList').innerHTML = Object.keys(hit).sort(function (a, b) { return hit[b] - hit[a]; }).slice(0, 40)
    .map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');

  var items = itemSering().filter(function (x) { return x.s === s && x.k === k && x.b; });
  $('itemChips').innerHTML = items.map(function (x, i) {
    return '<button type="button" class="chip" data-i="' + i + '">' + esc(x.b) + '</button>';
  }).join('');
  $('itemChips').onclick = function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    pakaiItem(items[+b.getAttribute('data-i')]);
  };

  var piutang = k === 'Piutang', cash = k === 'Cash';
  $('ketLabel').innerHTML = piutang ? 'Nama' : 'Keterangan <span class="opt">(opsional)</span>';
  $('ket').placeholder = piutang ? 'nama orang' : 'pilih di bawah atau ketik';
  $('hint').textContent = piutang ? 'Plus = kamu meminjamkan. Minus (tekan ±) = dibayar kembali.'
    : cash ? 'Plus = tarik tunai / penjualan cash PGNet. Minus (tekan ±) = dipakai PGNet atau sudah dicatat di tempat lain.'
    : k === DATA.bm3.kategori ? 'Hari ini ' + rp(targetBm3($('tanggal').value || hariIni())) + '.'
    : '';
  $('cekCash').hidden = piutang || cash;
  if (piutang || cash) $('pakaiCash').checked = false;
}

function setMinus(v) { MINUS = v; $('pm').classList.toggle('aktif', v); formatInput($('jumlah'), v); }

function pakaiItem(x) {
  if (x.s !== SEKSI_AKTIF) { SEKSI_AKTIF = x.s; renderSeksi(); isiKategori(x.k); }
  else if ($('kategori').value !== x.k) { $('kategori').value = x.k; ubahKategori(); }
  $('ket').value = x.b ? (x.adaVarian ? x.b + ' · ' : x.b) : '';
  var t = $('tanggal').value || hariIni();
  var n = sama(x.k, DATA.bm3.kategori) ? Math.max(targetBm3(t) - totalBm3(t), 0) || targetBm3(t) : x.tetap;
  $('jumlah').value = n ? String(n) : '';
  setMinus(!!x.minus);
  if (x.adaVarian) { $('ket').focus(); } else if (!n) { $('jumlah').focus(); }
}

function resetForm() {
  $('ket').value = ''; $('jumlah').value = ''; $('pakaiCash').checked = false;
  $('jam').value = jamIni();
  setMinus(false);
}

function simpanForm() {
  var pesan = $('pesan'); pesan.hidden = true;
  var n = angkaDari($('jumlah').value);
  var t = $('tanggal').value, j = $('jam').value, s = SEKSI_AKTIF, k = $('kategori').value;
  var ket = $('ket').value.replace(/\s*·\s*$/, '').trim();
  if (!t) { pesan.textContent = 'Tanggal belum diisi.'; pesan.hidden = false; return; }
  if (!n) { pesan.textContent = 'Jumlah belum diisi.'; pesan.hidden = false; $('jumlah').focus(); return; }
  if (k === 'Piutang' && !ket) { pesan.textContent = 'Nama orang belum diisi.'; pesan.hidden = false; $('ket').focus(); return; }

  var id = buatId();
  var rows = [{ id:id, t:t, j:j, s:s, k:k, ket:ket, n:n }];
  if ($('pakaiCash').checked && !$('cekCash').hidden && n > 0) {
    rows.push({ id:id + '-c', t:t, j:j, s:'Pribadi', k:'Cash', ket:'Dibayar Cash · ' + (ket || k), n:-n });
  }
  catat(rows, (ket || k) + ' ' + rp(n) + (rows.length > 1 ? ' + cash' : ''));
  resetForm();
}

/* ---------- sering dipakai (lintas kategori) ---------- */
function renderCepat() {
  var items = itemSering().slice(0, 10);
  $('cepat').innerHTML = items.length ? items.map(function (x, i) {
    return '<button type="button" class="chip" data-i="' + i + '">' + esc(x.b || x.k) +
           ' <small>' + esc(x.b ? x.k : x.s) + '</small></button>';
  }).join('') : '<span class="kecil">Muncul otomatis setelah ada catatan rutin.</span>';
  $('cepat').onclick = function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    pakaiItem(items[+b.getAttribute('data-i')]);
    $('jumlah').scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
}

/* ---------- banner pengingat ---------- */
function renderBanner() {
  var t = hariIni(), h = '', jamNow = new Date().getHours();
  var tb = totalBm3(t), tg = targetBm3(t);
  if (jamNow >= 3 && tb < tg) {
    h += '<div class="ingat"><div class="tx"><b>' + (tb ? 'BM3 hari ini kurang ' + rp(tg - tb) : 'Belum sedekah BM3 hari ini') +
         '</b>' + HARI[new Date().getDay()] + ' · ' + rp(tg) + '</div>' +
         '<button class="btn2" data-aksi="bm3">Catat ' + rp(tg - tb) + '</button></div>';
  }
  (DATA.paket || []).forEach(function (p) {
    var m = masaPaket(p, t); if (!m) return;
    var st = statusPaket(p, t).filter(function (x) { return !x.sudah; });
    if (!st.length) return;
    h += '<div class="ingat' + (m === 2 ? ' akhir' : '') + '"><div class="tx"><b>' + (m === 2 ? '⚠️ Terakhir: ' : '') + esc(p.nama) +
         ' belum lengkap</b>' + st.map(function (x) { return esc(x.it.t || x.it.k) + (x.sisa && x.total ? ' (kurang ' + rp(x.sisa) + ')' : ''); }).join(', ') +
         '</div><button class="btn2" data-aksi="paket" data-p="' + p.id + '">Buka</button></div>';
  });
  $('banner').innerHTML = h;
}

function renderPaketRow() {
  var t = hariIni();
  $('paketRow').innerHTML = (DATA.paket || []).map(function (p) {
    var st = statusPaket(p, t), belum = st.filter(function (x) { return !x.sudah; }).length;
    var perlu = masaPaket(p, t) && belum;
    return '<button type="button" data-p="' + p.id + '" class="' + (perlu ? 'perlu' : '') + '">' +
           esc(p.nama.replace('Paket ', '')) + '<small>' + (belum ? belum + ' belum' : '✓ lengkap') + '</small></button>';
  }).join('');
}

/* ---------- riwayat ---------- */
function renderRiwayat() {
  var r = semua().map(function (x, i) { return { x: x, i: i }; });
  r.sort(function (a, b) {
    if (!!a.x[7] !== !!b.x[7]) return a.x[7] ? -1 : 1;
    if (a.x[0] !== b.x[0]) return a.x[0] < b.x[0] ? 1 : -1;
    return b.i - a.i;
  });
  r = r.slice(0, 12);
  $('riwayat').innerHTML = r.length ? r.map(function (o) {
    var x = o.x;
    return '<div class="rw"><div class="a"><div>' + esc(x[4] || x[3]) + (x[7] ? '<span class="tunggu">menunggu</span>' : '') +
           '</div><small>' + tglIndo(x[0]) + (x[1] ? ' ' + x[1] : '') + ' · ' + esc(x[2]) + ' · ' + esc(x[3]) + '</small></div>' +
           '<div class="n' + (x[5] < 0 ? ' min' : '') + '">' + rp(x[5]) + '</div></div>';
  }).join('') : '<div class="kosong">Belum ada catatan.</div>';
}

/* ==================================================================
   PAKET
   ================================================================== */
function bukaPaket(id) {
  var p = (DATA.paket || []).filter(function (x) { return x.id === id; })[0]; if (!p) return;
  var t = $('tanggal').value || hariIni();
  var st = statusPaket(p, t);
  var h = '<h3>' + esc(p.nama) + '</h3><div class="kecil">' + tglIndo(t) + ' · centang yang mau dicatat, nominal bisa diubah.</div>';
  st.forEach(function (x, i) {
    var it = x.it;
    var n = it.penuh ? (x.sisa || it.j) : (it.terakhir ? (x.akhir || '') : it.j);
    if (sama(it.k, DATA.bm3.kategori) && p.periode === 'hari') n = Math.max(targetBm3(t) - totalBm3(t), 0) || targetBm3(t);
    var ket = x.sudah ? '<small class="ok">✓ sudah ' + rp(x.total) + '</small>'
            : (x.total ? '<small>sudah ' + rp(x.total) + ', kurang ' + rp(x.sisa) + '</small>' : '<small>' + esc(it.k) + '</small>');
    h += '<label class="pk"><input type="checkbox" data-i="' + i + '"' + (x.sudah ? '' : ' checked') + '>' +
         '<span class="nm">' + esc(it.t || it.k) + ket + '</span>' +
         '<input class="jm" inputmode="numeric" data-j="' + i + '" value="' + (n ? 'Rp ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '') + '" placeholder="Rp 0"></label>';
  });
  h += '<label class="cek"><input type="checkbox" id="paketCash"> Dibayar pakai cash</label>' +
       '<div class="salah" id="paketSalah" hidden></div>' +
       '<div class="baris-btn"><button class="btn batal" id="paketBatal">Tutup</button><button class="btn" id="paketSimpan">Simpan</button></div>';
  $('modal').innerHTML = h;
  $('lapis').classList.add('buka');
  Array.prototype.forEach.call($('modal').querySelectorAll('input.jm'), function (el) {
    el.addEventListener('input', function () { formatInput(el, false); });
    el.addEventListener('focus', function () { el.closest('.pk').querySelector('input[type=checkbox]').checked = true; });
  });
  $('paketBatal').onclick = tutupModal;
  $('paketSimpan').onclick = function () {
    var rows = [], total = 0, jam = $('jam').value || jamIni(), kosong = false;
    st.forEach(function (x, i) {
      if (!$('modal').querySelector('input[data-i="' + i + '"]').checked) return;
      var n = angkaDari($('modal').querySelector('input[data-j="' + i + '"]').value);
      if (!n) { kosong = true; return; }
      var id = buatId();
      rows.push({ id:id, t:t, j:jam, s:x.it.s, k:x.it.k, ket:x.it.t, n:n });
      if ($('paketCash').checked) rows.push({ id:id + '-c', t:t, j:jam, s:'Pribadi', k:'Cash', ket:'Dibayar Cash · ' + (x.it.t || x.it.k), n:-n });
      total += n;
    });
    if (kosong) { $('paketSalah').textContent = 'Ada item yang dicentang tapi nominalnya kosong.'; $('paketSalah').hidden = false; return; }
    if (!rows.length) { $('paketSalah').textContent = 'Belum ada item yang dicentang.'; $('paketSalah').hidden = false; return; }
    tutupModal();
    catat(rows, p.nama + ' ' + rp(total));
  };
}
function tutupModal() { $('lapis').classList.remove('buka'); }

/* ==================================================================
   RINGKASAN
   ================================================================== */
function renderRingkas() {
  var bIni = bulanDari(hariIni());
  var ym = PERIODE === 'ini' ? bIni : PERIODE === 'lalu' ? bulanGeser(bIni, -1) : '';
  var rows = semua().filter(function (r) { return !ym || r[0].slice(0, 7) === ym; });

  var total = 0, perSeksi = {}, perKat = {}, cPlus = 0, cMin = 0;
  rows.forEach(function (r) {
    if (r[3] === 'Piutang') return;
    total += r[5];
    perSeksi[r[2]] = (perSeksi[r[2]] || 0) + r[5];
    var key = r[2] + '|' + r[3];
    var o = perKat[key] || (perKat[key] = { s:r[2], k:r[3], n:0, item:{} });
    o.n += r[5];
    var it = r[3] === 'Cash' ? (r[5] < 0 ? '− ' : '+ ') + (dasar(r[4]) || 'Tanpa keterangan') : (dasar(r[4]) || 'Tanpa keterangan');
    o.item[it] = (o.item[it] || 0) + r[5];
    if (r[3] === 'Cash') { if (r[5] > 0) cPlus += r[5]; else cMin += r[5]; }
  });

  var pembanding = '';
  if (PERIODE === 'ini') {
    var hari = +hariIni().slice(8), lalu = bulanGeser(bIni, -1), tl = 0;
    semua().forEach(function (r) { if (r[3] !== 'Piutang' && r[0].slice(0, 7) === lalu && +r[0].slice(8) <= hari) tl += r[5]; });
    pembanding = 'Bulan lalu sampai tanggal ' + hari + ': ' + rp(tl);
  }

  var h = '<div class="hero"><div class="lbl">Total pengeluaran · ' + (ym ? namaBulan(ym) : 'semua data') + '</div>' +
          '<div class="val">' + rp(total) + '</div>' + (pembanding ? '<div class="bdg">' + pembanding + '</div>' : '') + '</div>';

  h += '<div class="mini-row"><div class="mini"><div class="lbl">Cash bersih</div><div class="val">' + rp(cPlus + cMin) + '</div>' +
       '<div class="ket">masuk ' + rp(cPlus) + ' · berkurang ' + rp(-cMin) + '</div></div>';
  var piu = hitungPiutang();
  h += '<div class="mini"><div class="lbl">Piutang belum kembali</div><div class="val">' + rp(piu.total) + '</div>' +
       '<div class="ket">semua waktu · ' + piu.list.filter(function (x) { return x.n > 0; }).length + ' orang</div></div></div>';

  if (!rows.length) { $('ringkas').innerHTML = h + '<div class="kosong">Belum ada catatan di periode ini.</div>'; return; }

  var maxS = 0; SEKSI.forEach(function (s) { maxS = Math.max(maxS, perSeksi[s] || 0); });
  h += '<div class="judul-kecil">Per seksi</div>';
  SEKSI.concat(Object.keys(perSeksi).filter(function (s) { return SEKSI.indexOf(s) < 0; })).forEach(function (s) {
    if (!perSeksi[s]) return;
    h += '<div class="seksi-item"><div class="seksi-top"><span>' + esc(s) + '</span><span>' + rp(perSeksi[s]) + '</span></div>' +
         '<div class="bar"><span style="width:' + Math.max(0, perSeksi[s] / maxS * 100) + '%;background:' + (WARNA[s] || '#0d6b6b') + '"></span></div></div>';
  });

  var kats = Object.keys(perKat).map(function (k) { return perKat[k]; }).sort(function (a, b) { return b.n - a.n; });
  var maxK = kats.length ? Math.max.apply(null, kats.map(function (x) { return x.n; })) : 0;
  h += '<div class="judul-kecil">Per kategori <span style="text-transform:none;font-weight:400">· ketuk untuk rincian</span></div>';
  kats.forEach(function (o) {
    var items = Object.keys(o.item).sort(function (a, b) { return Math.abs(o.item[b]) - Math.abs(o.item[a]); });
    h += '<details class="kat"><summary><div class="kat-top"><span>' + esc(o.k) + ' <small>' + esc(o.s) + '</small></span>' +
         '<span class="v">' + rp(o.n) + '</span></div><div class="kat-bar"><span style="width:' + (maxK > 0 ? Math.max(0, o.n / maxK * 100) : 0) + '%"></span></div></summary>' +
         '<div class="rinci">' + items.map(function (i) { return '<div><span>' + esc(i) + '</span><span>' + rp(o.item[i]) + '</span></div>'; }).join('') + '</div></details>';
  });

  if (piu.list.length) {
    h += '<div class="judul-kecil">Piutang per orang <span style="text-transform:none;font-weight:400">· semua waktu</span></div>';
    piu.list.forEach(function (x) {
      h += '<div class="rw"><div class="a"><div>' + esc(x.nama) + '</div><small>dipinjam ' + rp(x.pinjam) + ' · dibayar ' + rp(x.bayar) + '</small></div>' +
           '<div class="n' + (x.n <= 0 ? ' min' : '') + '">' + (x.n === 0 ? 'lunas' : rp(x.n)) + '</div></div>';
    });
  }
  $('ringkas').innerHTML = h;
}

function hitungPiutang() {
  var o = {};
  semua().forEach(function (r) {
    if (r[3] !== 'Piutang') return;
    var nm = dasar(r[4]) || 'Tanpa nama', key = nm.toLowerCase();
    var x = o[key] || (o[key] = { nama: nm, pinjam: 0, bayar: 0, n: 0 });
    if (r[5] > 0) x.pinjam += r[5]; else x.bayar += -r[5];
    x.n += r[5];
  });
  var list = Object.keys(o).map(function (k) { return o[k]; }).sort(function (a, b) { return b.n - a.n; });
  var total = 0; list.forEach(function (x) { if (x.n > 0) total += x.n; });
  return { list: list, total: total };
}

/* ==================================================================
   TAMPILAN UMUM
   ================================================================== */
var TAB = 'catat';
function renderSemua() {
  if (!KODE) return;
  renderBanner(); renderPaketRow(); renderCepat(); renderRiwayat();
  var k = $('kategori').value; isiKategori(k);
  if (TAB === 'ringkas') renderRingkas();
  $('infoData').textContent = DATA.r.length + ' catatan di Sheets' + (DATA.v ? ' · dimuat ' + new Date(DATA.v).toLocaleString('id-ID') : '');
  setStatus($('status').innerHTML.indexOf('spin') > -1 ? '<span class="spin"></span>' : '');
}

function pindahTab(t) {
  TAB = t;
  $('tabCatat').hidden = t !== 'catat'; $('tabRingkas').hidden = t !== 'ringkas';
  $('judul').textContent = t === 'catat' ? 'Catat Pengeluaran' : 'Ringkasan';
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
  if (t === 'ringkas') renderRingkas();
  window.scrollTo(0, 0);
}

var jamToast = null;
function toast(teks, batal) {
  $('toastTx').textContent = teks;
  var a = $('toastAksi'); a.hidden = !batal;
  a.onclick = function () { if (batal && !batal()) toast('Sudah terkirim, tidak bisa dibatalkan'); };
  $('toast').classList.add('buka');
  clearTimeout(jamToast); jamToast = setTimeout(function () { $('toast').classList.remove('buka'); }, batal ? 4000 : 2600);
}

/* ==================================================================
   KODE AKSES
   ================================================================== */
function mintaKode(pesan) {
  KODE = ''; hapusLokal(K_KODE); hapusLokal(K_DATA);
  DATA = { r: [], kategori: {}, paket: [], bm3: DATA.bm3, v: 0 };
  $('gerbang').hidden = false; $('tabCatat').hidden = true; $('tabRingkas').hidden = true; $('nav').hidden = true;
  $('kodeSalah').textContent = pesan || ''; $('kodeSalah').hidden = !pesan;
  setStatus('');
}

function kirimKode() {
  var k = $('kode').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (k.length < 8) { $('kodeSalah').textContent = 'Kode akses terdiri dari 10 huruf dan angka.'; $('kodeSalah').hidden = false; return; }
  $('btnKode').disabled = true; $('btnKode').textContent = 'Memeriksa…'; KODE = k;
  panggil('data=1', function (err, d) {
    $('btnKode').disabled = false; $('btnKode').textContent = 'Masuk';
    if (err) { KODE = ''; $('kodeSalah').textContent = err.kodeSalah ? 'Kode akses salah.' : err.message; $('kodeSalah').hidden = false; return; }
    simpanLokal(K_KODE, k); DATA = d; simpanLokal(K_DATA, DATA); $('kode').value = '';
    masuk();
  });
}

function masuk() {
  $('gerbang').hidden = true; $('nav').hidden = false;
  pindahTab('catat');
  renderSeksi();
  renderSemua();
  if (ANTRE.length) jadwalKirim(500);
}

/* ---------- buka dari notifikasi: ?buka=paket-awal / bm3 ---------- */
var sudahBukaTautan = false;
function bukaDariTautan() {
  if (sudahBukaTautan) return;
  var m = location.search.match(/[?&]buka=([a-z0-9-]+)/); if (!m) return;
  sudahBukaTautan = true;
  if (m[1].indexOf('paket-') === 0) bukaPaket(m[1].slice(6));
  else if (m[1] === 'bm3') pakaiItem({ s:'Sedekah', k:DATA.bm3.kategori, b:'', tetap:0 });
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

/* ==================================================================
   NOTIFIKASI (FIREBASE, OPSIONAL)
   ================================================================== */
var DI_APPS_SCRIPT = location.hostname.indexOf('googleusercontent.com') > -1 || location.hostname.indexOf('script.google') > -1;
function notifDidukung() { return !DI_APPS_SCRIPT && CFG.FIREBASE && CFG.VAPID && 'serviceWorker' in navigator; }

function muatSkrip(src) {
  return new Promise(function (ok, gagal) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = gagal; document.head.appendChild(s); });
}
var FB_VER = '10.12.2';
function siapFirebase() {
  if (window.firebase && firebase.messaging) return Promise.resolve();
  return muatSkrip('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app-compat.js')
    .then(function () { return muatSkrip('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-messaging-compat.js'); })
    .then(function () { if (!firebase.apps.length) firebase.initializeApp(CFG.FIREBASE); });
}

function aturTombolNotif() {
  if (!notifDidukung()) return;
  $('btnNotif').hidden = false;
  var info = $('notifInfo');
  if (!('Notification' in window)) {
    info.hidden = false; info.textContent = 'Di iPhone: pasang dulu lewat Safari → Bagikan → Tambahkan ke Layar Utama, lalu buka dari ikonnya.';
    $('btnNotif').disabled = true; return;
  }
  if (Notification.permission === 'granted') { $('btnNotif').textContent = '🔔 Notifikasi aktif · daftarkan ulang HP ini'; dengarDepan(); }
  if (Notification.permission === 'denied') { info.hidden = false; info.textContent = 'Notifikasi diblokir. Buka pengaturan situs/aplikasi di HP untuk mengizinkan.'; }
}

function dengarDepan() {
  siapFirebase().then(function () {
    firebase.messaging().onMessage(function (p) { var n = p.notification || {}; toast((n.title || 'Pengingat') + (n.body ? ' — ' + n.body : '')); renderBanner(); });
  }).catch(function () {});
}

function aktifkanNotif() {
  var info = $('notifInfo'); info.hidden = false; info.textContent = 'Menyiapkan…';
  Notification.requestPermission().then(function (izin) {
    if (izin !== 'granted') throw new Error('Izin notifikasi tidak diberikan.');
    return siapFirebase();
  }).then(function () { return navigator.serviceWorker.ready; })
    .then(function (reg) { return firebase.messaging().getToken({ vapidKey: CFG.VAPID, serviceWorkerRegistration: reg }); })
    .then(function (token) {
      if (!token) throw new Error('Token notifikasi kosong.');
      panggil('token=' + encodeURIComponent(token) + '&app=' + encodeURIComponent(location.origin + location.pathname), function (err, r) {
        info.textContent = err ? 'Gagal mendaftar: ' + err.message : '✓ HP ini terdaftar untuk pengingat (' + r.jumlahHP + ' HP).';
        if (!err) { $('btnNotif').textContent = '🔔 Notifikasi aktif · daftarkan ulang HP ini'; dengarDepan(); }
      });
    }).catch(function (e) { info.textContent = e.message || String(e); });
}

/* ==================================================================
   PEMASANGAN
   ================================================================== */
(function () {
  $('tanggal').value = hariIni(); $('jam').value = jamIni();
  $('btnKode').onclick = kirimKode;
  $('kode').addEventListener('keydown', function (e) { if (e.key === 'Enter') kirimKode(); });
  $('seksi').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; SEKSI_AKTIF = b.getAttribute('data-s'); renderSeksi(); isiKategori(); };
  $('kategori').onchange = function () { $('ket').value = ''; ubahKategori(); };
  $('tanggal').onchange = ubahKategori;
  $('jumlah').addEventListener('input', function () { var v = $('jumlah').value.trim(); if (v.charAt(0) === '-' && !MINUS) MINUS = true; formatInput($('jumlah'), MINUS); $('pm').classList.toggle('aktif', MINUS); });
  $('pm').onclick = function () { setMinus(!MINUS); $('jumlah').focus(); };
  $('simpan').onclick = simpanForm;
  $('paketRow').onclick = function (e) { var b = e.target.closest('button'); if (b) bukaPaket(b.getAttribute('data-p')); };
  $('banner').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-aksi') === 'paket') { bukaPaket(b.getAttribute('data-p')); return; }
    var t = hariIni(), n = targetBm3(t) - totalBm3(t);
    if (n > 0) catat([{ id:buatId(), t:t, j:jamIni(), s:'Sedekah', k:DATA.bm3.kategori, ket:'', n:n }], 'BM3 ' + rp(n));
  };
  $('lapis').onclick = function (e) { if (e.target === $('lapis')) tutupModal(); };
  $('nav').onclick = function (e) { var b = e.target.closest('button'); if (b) pindahTab(b.getAttribute('data-tab')); };
  $('periode').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return; PERIODE = b.getAttribute('data-p');
    Array.prototype.forEach.call($('periode').children, function (x) { x.classList.toggle('on', x === b); });
    renderRingkas();
  };
  $('btnMuat').onclick = function () { muatData(false); if (ANTRE.length) jadwalKirim(0); };
  $('btnKeluar').onclick = function () {
    var n = 0; ANTRE.forEach(function (b) { n += b.rows.length; });
    if (n && !confirmTeks()) return;
    mintaKode('');
  };
  $('btnNotif').onclick = aktifkanNotif;

  ANTRE = ambilLokal(K_ANTRE) || [];
  ANTRE.forEach(function (b) { b.kirim = false; });
  KODE = ambilLokal(K_KODE) || '';
  var d = ambilLokal(K_DATA); if (d && d.r) DATA = d;

  if (!KODE) mintaKode('');
  else { masuk(); muatData(!!DATA.v); }
  aturTombolNotif();

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !KODE) return;
    $('tanggal').value = $('tanggal').value || hariIni();
    if (!$('jumlah').value) $('jam').value = jamIni();
    muatData(true); if (ANTRE.length) jadwalKirim(0);
  });
  window.addEventListener('online', function () { if (ANTRE.length) jadwalKirim(0); });
  setInterval(function () { if (ANTRE.length && !MENGIRIM) kirimAntrean(); }, 20000);

  if ('serviceWorker' in navigator && !DI_APPS_SCRIPT) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();

/* Keluar saat masih ada antrean: pakai toast tanpa dialog browser. */
var konfirmasiKeluar = 0;
function confirmTeks() {
  if (Date.now() - konfirmasiKeluar < 5000) return true;
  konfirmasiKeluar = Date.now();
  toast('Masih ada catatan belum terkirim. Tekan Keluar sekali lagi untuk tetap keluar.');
  return false;
}
</script>
